name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/fitness_test
          JWT_ACCESS_SECRET: test-access-secret-key-minimum-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-minimum-32-chars
          CSRF_SECRET: test-csrf-secret-key-min

      - name: Test with coverage
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/fitness_test
          JWT_ACCESS_SECRET: test-access-secret-key-minimum-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-minimum-32-chars
          CSRF_SECRET: test-csrf-secret-key-min
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fitness-platform-backend:${{ github.sha }} .
